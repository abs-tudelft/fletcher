name: Test

on:
  push:
    branches:
      - develop
      - staging
      - trying
  pull_request:

env:
  ARROW_VERSION: "17.0.0"

jobs:
  cpp:
    name: "C++"
    strategy:
      fail-fast: false
      matrix:
        source:
          - codegen/cpp/fletchgen
          - runtime/cpp
          - platforms/echo/runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Apache Arrow
        run: |
          sudo apt update
          sudo apt install -y -V ca-certificates lsb-release wget
          wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt update
          sudo apt install -y -V libarrow-dev=${ARROW_VERSION}-1
      - name: Configure
        run: |
          cmake ${{ matrix.source }} -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: |
          make -j
      - name: Test
        run: |
          make test

  python:
    name: Python
    strategy:
      fail-fast: false
      matrix:
        source:
          - runtime/python
          - codegen/python
        include:
          - source: runtime/python
            package: pyfletcher
          - source: codegen/python
            package: pyfletchgen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Apache Arrow
        run: |
          sudo apt update
          sudo apt install -y -V ca-certificates lsb-release wget
          wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt update
          sudo apt install -y -V libarrow-dev=${ARROW_VERSION}-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pyarrow
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyarrow==$ARROW_VERSION
      - name: Build and install
        working-directory: ${{ matrix.source }}
        run: python -m pip install .
      - name: Import
        run: python -c "import ${{ matrix.package }}"

  vhdl:
    name: VHDL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ghdl/setup-ghdl@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install vhdeps
      - name: vhdeps
        run: vhdeps -i hardware ghdl -- --pattern '*_tc' --pattern ':!*/vhlib/*'
